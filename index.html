  </div>

  <div id="settings-panel" class="popover settings-popover" aria-label="阅读设置">
    <div class="setting-row"><span>字号</span><div><button data-font="-1">A−</button><button data-font="1">A＋</button></div></div>
    <div class="setting-row"><span>行距</span><div><button data-line="compact">紧</button><button data-line="normal">中</button><button data-line="loose">松</button></div></div>
    <div class="setting-row"><span>版心</span><div><button data-width="narrow">窄</button><button data-width="normal">中</button><button data-width="wide">宽</button></div></div>
    <div class="setting-row"><span>字体</span><div><button data-face="serif">宋</button><button data-face="kai">楷</button><button data-face="sans">黑</button></div></div>
    <div class="setting-row"><span>纸色</span><div><button data-paper="rice">米</button><button data-paper="xuan">宣</button><button data-paper="sepia">褐</button></div></div>
    <div class="setting-row"><span>首字下沉</span><div><button id="toggle-dropcap">开</button></div></div>
    <div class="setting-row"><span>沉浸模式</span><div><button id="enter-immersive">进入</button></div></div>
    <button id="reset-reading" class="settings-reset">恢复默认</button>
  </div>
